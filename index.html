<script src="
https://unpkg.com/mqtt/dist/mqtt.min.js">
</script>


<button onclick="send('open_26')">
制冷---26°
</button>

<button onclick="send('open_24')">
制冷---24°
</button>

<button onclick="send('close')">
关闭空调
</button>

<script>


const client =
mqtt.connect(
"wss://broker.emqx.io:8084/mqtt"
);



client.on(
"connect",
()=>{

console.log(
"mqtt connected"
);

});



function send(cmd)
{

client.publish(
"kfc/infrared/cmd",
cmd
);

}


</script>
